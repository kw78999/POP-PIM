name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python -m tools.verify_replay
      - run: python -m tools.prepare_inputs
      - run: |
          for suite in main ablation refresh; do
            python -m tools.rebuild_tables --suite "$suite" --output-dir "outputs/ci_tables/$suite"
          done
      - run: python -m tools.check_release
  simulator-quick:
    runs-on: ubuntu-22.04
    env:
      CXX: g++-10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++-10 cmake verilator
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m tools.build --jobs 4
      - run: python -m tools.reproduce --suite quick --jobs 4
      - run: python -m tools.verify_rtl --tests refresh quarter gs vs --jobs 4
